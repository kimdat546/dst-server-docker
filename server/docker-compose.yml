services:
  master:
    image: kimdat546/dst-server:latest
    container_name: dst-master-than-binh-phu-an
    network_mode: host
    environment:
      # DST_CLUSTER_TOKEN cố tình KHÔNG để ở đây — repo này public.
      # `dst init` bơm token vào .world.env từ tokens.env (xem `dst token`).
      DST_NETWORK_CLUSTER_NAME: "Neverland - Thần binh phù ấn"
      DST_NETWORK_CLUSTER_DESCRIPTION: "Neverland — Than Binh Phu An + NewConstant Viet hoa"
      DST_NETWORK_CLUSTER_PASSWORD: "haizz"
      DST_GAMEPLAY_MAX_PLAYERS: "12"
      DST_GAMEPLAY_GAME_MODE: "endless"
      DST_NETWORK_SERVER_PORT: "11999"
      # cli/compose.yml lấy cổng Caves từ biến này, KHÔNG từ service caves bên dưới
      DST_CAVES_PORT: "11998"
      DST_SHARD_ENABLED: "true"
      DST_SHARD_IS_MASTER: "true"
      DST_SHARD_NAME: "Master"
      DST_SHARD_BIND_IP: "0.0.0.0"
      DST_SHARD_MASTER_IP: "127.0.0.1"
      DST_SHARD_MASTER_PORT: "11888"
      DST_SHARD_CLUSTER_KEY: "neverland_tbpa"
      DST_SERVER_MOD_SETUP: "1111658995,1392778117,1780476441,1803285852,1909182187,1991746508,2630628898,3235319974,3353852416,3401927745,3597024951,3625940357,374550642,375850593,3778107626,3778108141,3778108374,3792863569,380423963,501385076"
    volumes:
      - dst-master-data-than-binh-phu-an:/var/lib/game
      - ./config/Master/modoverrides.lua:/etc/dst-config/Master/modoverrides.lua:ro
      - ./config/Master/leveldataoverride.lua:/etc/dst-config/Master/leveldataoverride.lua:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "grep", "-q", "shard_enabled = true", "/var/lib/game/server/general/cluster.ini" ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  caves:
    image: kimdat546/dst-server:latest
    container_name: dst-caves-than-binh-phu-an
    network_mode: host
    environment:
      # DST_CLUSTER_TOKEN cố tình KHÔNG để ở đây — repo này public.
      # `dst init` bơm token vào .world.env từ tokens.env (xem `dst token`).
      DST_NETWORK_CLUSTER_NAME: "Neverland - Thần binh phù ấn"
      DST_NETWORK_SERVER_PORT: "11998"
      DST_SHARD_ENABLED: "true"
      DST_SHARD_IS_MASTER: "false"
      DST_SHARD_NAME: "Caves"
      DST_SHARD_BIND_IP: "0.0.0.0"
      DST_SHARD_MASTER_IP: "127.0.0.1"
      DST_SHARD_MASTER_PORT: "11888"
      DST_SHARD_CLUSTER_KEY: "neverland_tbpa"
      DST_SERVER_MOD_SETUP: "1111658995,1392778117,1780476441,1803285852,1909182187,1991746508,2630628898,3235319974,3353852416,3401927745,3597024951,3625940357,374550642,375850593,3778107626,3778108141,3778108374,3792863569,380423963,501385076"
    volumes:
      - dst-caves-data-than-binh-phu-an:/var/lib/game
      - ./config/Caves/modoverrides.lua:/etc/dst-config/Caves/modoverrides.lua:ro
      - ./config/Caves/leveldataoverride.lua:/etc/dst-config/Caves/leveldataoverride.lua:ro
    depends_on:
      master:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dst-master-data-than-binh-phu-an:
  dst-caves-data-than-binh-phu-an:
